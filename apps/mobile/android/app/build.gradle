apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders — monorepo layout (app lives in apps/mobile/, deps hoisted to the
     * repo-root node_modules by npm workspaces).
     *   root         : where the app package.json lives → apps/mobile (default ../..).
     *   reactNativeDir/codegenDir/cliFile : point at the hoisted root node_modules,
     *   four levels up from this module dir (apps/mobile/android/app). */
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    // Release JS bundling (Hermes) needs an explicit hermesc path too: the plugin
    // default resolves it relative to the app and misses the hoisted root
    // node_modules, failing `assembleRelease` with "Couldn't determine Hermesc
    // location". %OS-BIN% is substituted per-platform by the plugin.
    hermesCommand = file("../../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc").toString()

    /* Variants */
    //   Debuggable variants skip JS-bundle/asset packaging (they load from Metro).
    //   The default is just "debug", but this app has an `engine` flavor dimension
    //   (standard/gecko), so the debug variants are named per-flavor and must be
    //   listed explicitly — otherwise release-style bundling runs for debug too.
    debuggableVariants = ["standardDebug", "geckoDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Release signing. If android/keystore.properties exists (gitignored, see
// keystore.properties.example) it is used for release builds; otherwise release
// falls back to the debug key so contributors/CI can still `assembleRelease`.
// A store-ready build REQUIRES a real upload key here.
def releaseKeystorePropsFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = releaseKeystorePropsFile.exists()
def releaseKeystoreProps = new Properties()
if (hasReleaseKeystore) {
    releaseKeystoreProps.load(new FileInputStream(releaseKeystorePropsFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.spiderprivacybrowser"

    // GeckoView requires Java 17 source/target compatibility.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // GeckoView's native loader (GeckoLoader.putenv) needs the .so files
    // extracted to disk; the modern default (extractNativeLibs=false, libs read
    // straight from the APK) makes it SIGSEGV at startup. Force legacy packaging.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Per-ABI APK splits. GeckoView embeds Firefox's engine (libxul.so ~150 MB
    // uncompressed) once PER ABI; a universal APK bundling all four ABIs blows past
    // the 80 MB budget. Splits emit one APK per ABI so each device only carries its
    // own architecture. `universalApk false` disables the fat combined APK. Play
    // should ship an AAB (bundleRelease) instead, which does the same per-device
    // slicing automatically; splits keep F-Droid / sideload builds within budget.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }

    defaultConfig {
        applicationId "com.spiderprivacybrowser"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump both on every release. versionName must match src/version.ts
        // (the string shown in the Drawer/About); versionCode increments by 1.
        versionCode 13
        versionName "0.0.13"
    }

    // Two editions from one codebase (see docs/GECKOVIEW.md):
    //   standard — system WebView engine. No GeckoView linked, ~21 MB. The default
    //              build; ships to Google Play + F-Droid (fits the 80 MB budget).
    //   gecko    — bundles GeckoView (Mozilla's engine, engine-level ETP +
    //              anti-fingerprinting). ~92 MB/device, so it CANNOT ship on Play
    //              and intentionally exceeds the 80 MB budget; distributed off-Play
    //              (F-Droid / direct APK) as a separate package the user opts into.
    // The GeckoView dependency is `geckoImplementation` (below), so only this
    // flavor pays the size; the gecko-only Kotlin lives in src/gecko/.
    flavorDimensions "engine"
    productFlavors {
        standard {
            dimension "engine"
            // Default edition — nothing to add; GeckoView simply isn't compiled in.
        }
        gecko {
            dimension "engine"
            // Separate package id so both editions can be listed/installed side by
            // side (F-Droid variant pattern, cf. Fennec vs Mull).
            applicationIdSuffix ".gecko"
            versionNameSuffix "-gecko"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystoreProps['storeFile'])
                storePassword releaseKeystoreProps['storePassword']
                keyAlias releaseKeystoreProps['keyAlias']
                keyPassword releaseKeystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Uses the real upload key when android/keystore.properties is present,
            // otherwise falls back to the debug key (for local test builds only —
            // do NOT ship a debug-signed build to Play).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Give each per-ABI split its own versionCode so an app store never sees two APKs
// with the same code (Play/F-Droid reject that). Scheme: base*10 + abi-ordinal, so
// versionName 0.0.11 (code 11) yields 111/112/113/114. Higher ordinal = preferred
// on 64-bit devices. Not needed for AAB (bundleRelease), which slices per-device.
android.applicationVariants.all { variant ->
    def abiCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (abi != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiCodes.get(abi, 0)
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Used by the DNS-over-HTTPS VpnService (custom DNS resolver to avoid the
    // resolution loop). Same major version React Native already ships.
    implementation("com.squareup.okhttp3:okhttp:4.9.2")

    // GeckoView — Phase 4 browser engine (Mozilla's own renderer, engine-level
    // Enhanced Tracking Protection + anti-fingerprinting). `geckoImplementation`
    // (not `implementation`) links it ONLY into the `gecko` product flavor, so the
    // default `standard` edition stays at ~21 MB. The gecko-only Kotlin lives in
    // src/gecko/java (compiled only for that flavor); privacy-ext assets in
    // src/gecko/assets. Size is mitigated with ABI splits / AAB but still ~92 MB.
    // Universal multi-ABI artifact from maven.mozilla.org (see root build.gradle).
    // Pinned to 140.x: it depends on androidx.core 1.16.0 (compileSdk 35 / AGP
    // 8.8.2, this project's toolchain). GeckoView >= 145 pulls androidx.core
    // 1.17+/1.18+, which force compileSdk 36 + AGP 8.9.1 — bump those first if
    // upgrading GeckoView.
    geckoImplementation("org.mozilla.geckoview:geckoview:140.0.20250707120347")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Pure-JVM unit tests for the DNS packet parser/builder (checksums, round-trips).
    testImplementation("junit:junit:4.13.2")
}
