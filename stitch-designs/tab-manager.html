<!DOCTYPE html>

<html class="dark" lang="en"><head>

            transition: transform 0.3s ease;

        .tab-card:active {

<body class="bg-surface-dim selection:bg-primary/30">

<div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">4 tabs open</h1>
</div>
<button class="flex items-center gap-2 bg-primary-container text-on-primary-container px-5 py-2.5 rounded-full font-label-lg text-label-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>

</header>
<!-- Main Content: Tab Grid -->

</div>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-white/10 text-on-surface-variant hover:bg-error-container hover:text-on-error-container transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</button>
</div>

</div>
</div>
</div>
<!-- Tab Card 2 (Active) -->
<div class="tab-card bg-surface-container rounded-[20px] ring-2 ring-primary/50 overflow-hidden flex flex-col group transition-all duration-300 relative shadow-[0_0_20px_rgba(202,190,255,0.1)]">
<div class="p-3 flex items-center justify-between bg-primary/10">
<div class="flex items-center gap-2 overflow-hidden">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="public">public</span>
<span class="font-label-md text-label-md text-primary font-bold truncate">github.com</span>
</div>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-primary/20 text-primary hover:bg-error-container hover:text-on-error-container transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</button>
</div>
<div class="aspect-[4/5] bg-surface-container-highest relative overflow-hidden">

</div>
</div>
</div>
<!-- Tab Card 3 -->
<div class="tab-card glass-card rounded-[20px] overflow-hidden flex flex-col group transition-all duration-300 hover:ring-2 hover:ring-primary/20">
<div class="p-3 flex items-center justify-between bg-white/5">
<div class="flex items-center gap-2 overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="article">article</span>

</div>

</div>
</div>
</div>
<!-- Tab Card 4 -->
<div class="tab-card glass-card rounded-[20px] overflow-hidden flex flex-col group transition-all duration-300 hover:ring-2 hover:ring-primary/20">
<div class="p-3 flex items-center justify-between bg-white/5">
<div class="flex items-center gap-2 overflow-hidden">
<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="search">search</span>

<div class="aspect-[4/5] bg-surface-container-highest relative overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center opacity-60 grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="A search engine results page with a focus on privacy. The interface is exceptionally clean, with result cards floating on a deep ink background. Accents of cyan and violet highlight secure connections and trackers blocked. The image captures the essence of anonymous, fast browsing within a sophisticated digital vault." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBMCFlm78ttS_J2oT12UuBE58J-V9aMlUQmCgy19ITb6Pd77z0zUbFvXCfo48tPl5vtW7vumNub27bTYVxQJG6g1IdLKBPD4CzkX2TuZZKWBLTEIT4LHyfsuHk30Mqk3Sjj_aN8EqbhMHkCVj7ZSJZHL4OT0MbeTlMIPwXzScGgd88WpasHYcm4NNje73rI9q-7zAw52SJAJupWS-2nUVAWGIlNo-ThsdIuJe0UAFnAasqwt1FtmG9kFKwjVerloLxaEhXp00faUO4r')">

</main>
<!-- Bottom Actions & Navigation -->
<div class="fixed bottom-0 left-0 right-0 z-40">
<!-- Close All Action -->
<div class="flex justify-center mb-8">
<button class="bg-error/10 text-error border border-error/20 px-8 py-3 rounded-full font-label-lg text-label-lg hover:bg-error/20 active:scale-95 transition-all">
                Close all
            </button>
</div>
<!-- Shared Component: BottomNavBar -->
<nav class="fixed bottom-safe-area-bottom left-1/2 -translate-x-1/2 w-[90%] rounded-full bg-surface-container/40 backdrop-blur-2xl border border-white/10 shadow-[0_0_15px_rgba(124,92,252,0.15)] flex justify-around items-center px-4 py-3 z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-md text-label-md mt-1">Browse</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold bg-white/5 rounded-full p-2" href="#">
<span class="material-symbols-outlined" data-icon="tabs">tabs</span>
<span class="font-label-md text-label-md mt-1">Tabs</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-label-md mt-1">Shield</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md mt-1">Settings</span>
</a>
</nav>
</div>
<!-- Atmospheric Glow (Top Left) -->
<div class="fixed top-0 left-0 w-96 h-96 bg-primary/5 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
<script>
        // Simple interaction for tab closing (Visual only)
        document.querySelectorAll('.tab-card button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const card = e.target.closest('.tab-card');
                card.style.transform = 'scale(0.8)';
                card.style.opacity = '0';
                setTimeout(() => {
                    card.style.display = 'none';
                    // Optional: Update header count
                }, 300);
            });
        });
    </script>
</body></html>
