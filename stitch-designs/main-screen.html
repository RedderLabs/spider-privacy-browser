<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spider Privacy Browser - Mobile Interface</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Inter-like typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-layout">
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617; /* Slate-950 */
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Subtle background mesh/glow effects */
    .bg-mesh {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 10% 10%, rgba(88, 28, 135, 0.1) 0%, transparent 40%);
    }

    .glow-ring {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
    }

    .search-bar-gradient {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
    }

    /* Custom Navigation Bar blur */
    .nav-blur {
      backdrop-filter: blur(12px);
      background-color: rgba(15, 23, 42, 0.85);
    }
  </style>
<style data-purpose="components">
    /* Custom styles for specific elements that need precise look from the image */
    .concentric-ring {
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 50%;
    }
    
    .status-pill {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
  </style>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Mimicking the device frame shown in the reference -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#050914] rounded-[50px] border-[8px] border-[#1e293b] overflow-hidden shadow-2xl flex flex-col" data-purpose="mobile-frame">
<!-- BEGIN: StatusBar -->
<div class="flex justify-between items-center px-8 pt-4 pb-2 text-xs font-medium">
<div data-purpose="time">9:41</div>
<div class="flex items-center space-x-1.5">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 20 20"><path d="M2 11h16v2H2v-2zm0-4h16v2H2V7zm0-4h16v2H2V3z"></path></svg> <!-- Cellular icon placeholder -->
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24"><path d="M12 21l-12-18h24z"></path></svg> <!-- Wifi icon placeholder -->
<div class="w-6 h-3 border border-white/50 rounded-sm relative">
<div class="absolute inset-0.5 bg-white w-3/4"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: HeaderNav -->
<nav class="flex justify-between items-center px-6 py-4">
<button class="text-slate-400">
<svg class="h-7 w-7" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div class="text-slate-400">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</nav>
<!-- END: HeaderNav -->
<!-- BEGIN: MainContent -->
<main class="flex-grow flex flex-col items-center px-6 pt-6">
<!-- Brand Logo & Name Section -->
<div class="flex flex-col items-center mb-8" data-purpose="brand-identity">
<!-- Logo Icon -->
<div class="w-24 h-24 mb-4 relative flex items-center justify-center">
<div class="absolute inset-0 bg-blue-500/10 rounded-full blur-xl"></div>
<svg class="w-20 h-20 text-blue-500" fill="currentColor" viewbox="0 0 100 100">
<!-- Simplified Spider Shield Path -->
<path d="M50 5L15 20V45C15 67.2 30 87.8 50 95C70 87.8 85 67.2 85 45V20L50 5ZM50 25C54.4 25 58 28.6 58 33C58 35.1 57.2 36.9 55.8 38.3C58.3 39.8 60 42.4 60 45.5C60 47.9 59.1 50 57.6 51.6L63 60H58L53.5 52.8C52.4 53.5 51.2 54 50 54C48.8 54 47.6 53.5 46.5 52.8L42 60H37L42.4 51.6C40.9 50 40 47.9 40 45.5C40 42.4 41.7 39.8 44.2 38.3C42.8 36.9 42 35.1 42 33C42 28.6 45.6 25 50 25Z"></path>
</svg>
</div>
<h1 class="text-3xl font-bold tracking-tight text-center">
          Spider<span class="text-indigo-400">Privacy</span>
</h1>
<p class="text-slate-400 text-lg mt-1">Browser</p>
</div>
<!-- Search Bar Section -->
<div class="w-full mb-12" data-purpose="search-container">
<div class="search-bar-gradient flex items-center px-5 py-4 rounded-full border border-slate-700/50 shadow-inner">
<span class="text-slate-500 text-sm flex-grow">Buscar o escribir dirección</span>
<svg class="h-5 w-5 text-indigo-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Connection Status Visualization -->
<div class="relative flex items-center justify-center mb-10" data-purpose="status-visualization">
<!-- Concentric Glow Rings -->
<div class="concentric-ring w-64 h-64 absolute"></div>
<div class="concentric-ring w-52 h-52 absolute"></div>
<div class="concentric-ring w-40 h-40 absolute"></div>
<!-- Central Lock Shield -->
<div class="relative z-10 w-32 h-32 flex items-center justify-center bg-slate-900/50 rounded-full border border-blue-500/30 glow-ring">
<svg class="h-16 w-16 text-blue-500" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
<!-- Slogan and Status Pill -->
<div class="text-center mt-auto mb-8">
<p class="text-slate-400 text-sm mb-4">Tu privacidad. Nuestra misión.</p>
<div class="status-pill inline-flex items-center px-4 py-2 rounded-full text-xs font-semibold">
<svg class="h-3.5 w-3.5 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          Conectado a Red Privada
        </div>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterNavigation -->
<footer class="nav-blur border-t border-slate-800/50 pb-8 pt-4 px-6 flex justify-between items-center" data-purpose="bottom-toolbar">
<!-- Back Arrow -->
<button class="text-slate-400">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Forward Arrow -->
<button class="text-slate-400 opacity-30">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Home Icon -->
<button class="text-slate-100">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Tab Switcher -->
<button class="text-slate-400">
<div class="w-6 h-6 border-2 border-slate-400 rounded-md flex items-center justify-center text-[10px] font-bold">
          1
        </div>
</button>
<!-- Context Menu -->
<button class="text-slate-400">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</footer>
<!-- END: FooterNavigation -->
<!-- Home Indicator -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full"></div>
</div>
<!-- END: MobileDeviceContainer -->
</body></html>
